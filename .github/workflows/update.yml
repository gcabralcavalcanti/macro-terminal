# Collect public data, write the AI brief, build the page and publish it on GitHub Pages.
#
# Data refresh: every weekday after the Brazilian close (costs nothing).
# AI (brief + 5 preset ASK questions): only when the ANTHROPIC_API_KEY secret exists, and by default only on Mondays
#   (or on a manual run). Set the repository variable AI_DAILY=true to call it every weekday.
#   Caps per run: 2 calls for the brief, 12 for ASK (Haiku, 700 output tokens each). Measured on 19/10/2026: one brief =
#   1 call, 2,431 input + 556 output tokens, about US$ 0.0005; the 5 ASK presets about US$ 0.003.
#   The data, alerts and newsletter steps cost nothing.
#   To change the AI frequency, only the AI_DAILY variable (or the weekday test below) needs to change.
# Where to add the key: repository Settings > Secrets and variables > Actions > New repository secret
#   name ANTHROPIC_API_KEY. Pages: Settings > Pages > Source = GitHub Actions.
name: update

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC = 19:30 in Brasilia, after the B3 and US closes
  workflow_dispatch:
    inputs:
      brief:
        description: "Write the AI brief on this run (needs the secret)"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests (no network)
        run: python -m pytest -q

      # keeps the last good data and the large CVM zips between runs;
      # the committed data/cache is the fallback for the very first run
      - uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/brief.json
            data/ask.json
            newsletter
            recordings
            .downloads
          key: terminal-${{ github.run_id }}
          restore-keys: terminal-

      - name: Collect (a failing source keeps its cache and shows STALE)
        run: python -m macro_terminal collect

      - name: AI brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          AI_DAILY: ${{ vars.AI_DAILY }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.brief }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "No ANTHROPIC_API_KEY secret: showing the latest recorded brief."
            python -m macro_terminal brief --demo
          elif [ "$MANUAL" = "true" ] || [ "$AI_DAILY" = "true" ] || [ "$(date -u +%u)" = "1" ]; then
            python -m macro_terminal brief
            python -m macro_terminal ask
          else
            echo "AI brief runs on Mondays (set AI_DAILY=true for every weekday)."
            python -m macro_terminal brief --demo
          fi

      - run: python -m macro_terminal newsletter
      - run: python -m macro_terminal build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
